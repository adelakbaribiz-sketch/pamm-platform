{{- /*
Frontend Deployment — React/Vite static-served via nginx
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pamm.fullname" . }}-frontend
  labels:
    {{- include "pamm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      {{- include "pamm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "pamm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pamm.fullname" . }}-frontend
  labels:
    {{- include "pamm.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pamm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend

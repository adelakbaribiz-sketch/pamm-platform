{{- /*
Backend Deployment — FastAPI app serving REST API
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pamm.fullname" . }}-backend
  labels:
    {{- include "pamm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      {{- include "pamm.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "pamm.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        {{- if .Values.monitoring.prometheusScrape }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.monitoring.prometheusPort | quote }}
        prometheus.io/path: {{ .Values.monitoring.prometheusPath }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(PGUSER):$(PGPASSWORD)@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}?sslmode={{ .Values.postgres.sslmode }}"
            - name: REDIS_URL
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.existingSecret | default (include "pamm.fullname" .) }}
                  key: jwt-secret
            - name: ENVIRONMENT
              value: "production"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (include "pamm.fullname" .) }}
                  key: postgres-user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default (include "pamm.fullname" .) }}
                  key: postgres-password
          command: ["sh", "-c"]
          args:
            - |
              alembic upgrade head &&
              python -m app.seed &&
              uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
---
{{- /*
Backend Service
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pamm.fullname" . }}-backend
  labels:
    {{- include "pamm.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "pamm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend

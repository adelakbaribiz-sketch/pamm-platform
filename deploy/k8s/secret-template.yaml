# Secret template — DO NOT apply with these values. Create your own.
# Example:
#   kubectl create secret generic pamm-secrets \
#     --from-literal=postgres-user=pamm \
#     --from-literal=postgres-password=YOUR_STRONG_PASSWORD \
#     --from-literal=jwt-secret=YOUR_LONG_RANDOM_JWT_SECRET \
#     -n pamm-platform
---
apiVersion: v1
kind: Secret
metadata:
  name: pamm-secrets
  namespace: pamm-platform
type: Opaque
stringData:
  postgres-user: REPLACE_ME
  postgres-password: REPLACE_ME
  jwt-secret: REPLACE_ME_WITH_LONG_RANDOM_STRING

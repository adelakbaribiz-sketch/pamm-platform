version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pamm
      POSTGRES_USER: pamm
      POSTGRES_PASSWORD: pamm_dev_pw
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pamm -d pamm"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    environment: { VITE_API_PROXY: http://backend:8000 }
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
